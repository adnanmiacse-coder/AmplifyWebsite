<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23020B16'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='18' fill='%2300B7FF'>A</text></svg>">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — Amplify</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/quiz.css" />
<style id="amplify-universal-back-styles">
  .amplify-universal-back-btn {
    position: fixed !important;
    top: 14px !important;
    left: 16px !important;
    z-index: 2147483647 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 8px 18px !important;
    border-radius: 999px !important;
    background: rgba(3, 12, 24, 0.95) !important;
    border: 1.5px solid #00B7FF !important;
    color: #00B7FF !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", sans-serif !important;
    font-size: 13.5px !important;
    font-weight: 700 !important;
    letter-spacing: 0.02em !important;
    text-decoration: none !important;
    cursor: pointer !important;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.75), 0 0 12px rgba(0, 183, 255, 0.45) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
    user-select: none !important;
  }
  .amplify-universal-back-btn:hover,
  .amplify-universal-back-btn:focus-visible {
    background: #00B7FF !important;
    color: #020B16 !important;
    border-color: #00B7FF !important;
    box-shadow: 0 6px 24px rgba(0, 183, 255, 0.65), 0 0 20px rgba(0, 183, 255, 0.5) !important;
    transform: translateY(-2px) !important;
    outline: none !important;
  }
  .amplify-universal-back-btn:hover svg,
  .amplify-universal-back-btn:focus-visible svg {
    stroke: #020B16 !important;
    transform: translateX(-3px) !important;
  }
  .amplify-universal-back-btn:active {
    transform: translateY(0) scale(0.97) !important;
  }
  .amplify-universal-back-btn svg {
    width: 17px !important;
    height: 17px !important;
    stroke: currentColor !important;
    stroke-width: 2.8 !important;
    transition: transform 0.2s ease !important;
    flex-shrink: 0 !important;
  }
  @media (min-width: 641px) {
    .hdr .nav,
    .header .nav,
    .topbar,
    .page .nav,
    nav.nav,
    .stage-header {
      padding-left: 115px !important;
    }
    .nav-back,
    #home-back-btn {
      display: none !important;
    }
  }
  @media (max-width: 640px) {
    .amplify-universal-back-btn {
      top: 10px !important;
      left: 10px !important;
      padding: 6px 12px !important;
      font-size: 12px !important;
      gap: 5px !important;
    }
    .amplify-universal-back-btn svg {
      width: 15px !important;
      height: 15px !important;
    }
    .hdr .nav,
    .header .nav,
    .topbar,
    .page .nav,
    nav.nav {
      padding-left: 90px !important;
    }
    .nav-back,
    #home-back-btn {
      display: none !important;
    }
  }
</style>
</head>
<body>
  <!-- Universal Back Button -->
  <a href="/index.html" class="amplify-universal-back-btn" id="amplifyUniversalBackBtn" title="Back to Home" aria-label="Back to Home" onclick="if(window.amplifyGoBack){window.amplifyGoBack(event)}else{window.location.href='/index.html'}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span class="back-text">Back</span>
  </a>

  <header class="header" id="header">
    <div class="container">
      <nav class="nav">
        <a href="/" class="logo">Amplify</a>
        <div style="display:flex;gap:12px;">
          <a href="/index.html" class="nav-link-routine">Home</a>
          <a href="/routine.html" class="nav-link-routine">Routine</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="quiz-main">
    <div class="quiz-bg-orb orb-1"></div>
    <div class="quiz-bg-orb orb-2"></div>
    <div class="container">

      <div class="quiz-step" id="step-loading">
        <div class="loading-screen glass-card">
          <div class="loading-orb"></div>
          <h2>Generating your quiz...</h2>
          <p id="quizLoadingMsg">Finding NCTB standard questions</p>
          <div class="loading-bar">
            <div class="loading-fill" id="quizLoadingFill"></div>
          </div>
        </div>
      </div>

      <div class="quiz-step hidden" id="step-quiz">
        <div class="quiz-header glass-card">
          <div class="quiz-meta">
            <span id="quizSubjectLabel"></span>
            <span id="quizTopicLabel"></span>
          </div>

          <div class="quiz-top-row">
            <div class="quiz-progress-row">
              <div class="quiz-progress-copy">
                <span id="quizProgressText">Question 1 of 10</span>
              </div>
              <div class="quiz-progress-bar">
                <div class="quiz-progress-fill" id="quizProgressFill"></div>
              </div>
            </div>

            <div class="timer-pill" id="timerPill">
              <span class="timer-label">Time left</span>
              <span class="timer-value" id="timerText">10:00</span>
            </div>
          </div>
        </div>

        <div class="question-card glass-card" id="questionCard">
          <p class="question-number" id="questionNumber">Question 1</p>
          <h2 class="question-text" id="questionText"></h2>
          <div class="options-grid" id="optionsGrid"></div>
          <button class="btn btn-primary next-btn" id="nextBtn" style="display:none;" type="button">
            Next Question
          </button>
        </div>
      </div>

      <div class="quiz-step hidden" id="step-result">
        <div class="result-card glass-card">
          <h1 id="resultHeading">Quiz Complete</h1>
          <div class="score-display">
            <span id="scoreText"></span>
          </div>
          <p id="resultMessage"></p>
          <div class="result-actions">
            <button class="btn btn-primary" id="btnRetry" type="button">Retry Quiz</button>
            <button class="btn btn-outline" id="btnBackToRoutine" type="button">Back to Routine</button>
          </div>
          <div class="answer-review" id="answerReview"></div>
        </div>
      </div>

      <div class="quiz-step hidden" id="step-error">
        <div class="error-card glass-card">
          <h2>Could not generate quiz</h2>
          <p id="errorMsg"></p>
          <button class="btn btn-primary" id="btnGoBack" type="button">Go Back</button>
        </div>
      </div>

    </div>
  </main>

  <script src="/amplify-platform.js"></script>
  <script type="module" src="/src/quiz.js"></script>
</body>
</html>
